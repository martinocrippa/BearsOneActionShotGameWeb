<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The game loads nothing from outside its own origin: no CDN, no web fonts from outside, no analytics.
      `img-src data: blob:` is for the placeholder drawings (SVG turned into images on the fly).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'self'" />
    <meta name="theme-color" content="#ff2d8a" />
    <meta name="description" content="ORSI! Sparatutto in prima persona stile DOOM con orsi e dolciumi, da giocare in uno o in due." />
    <title>ORSI!</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <!-- Shared SVG filter: the slightly shaky "brush ink" line used by every drawing in the page. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" />
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
